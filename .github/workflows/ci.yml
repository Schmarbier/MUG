name: CI

on:
  pull_request:

jobs:
  build-and-test:
    name: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restaurar dependencias
        run: dotnet restore

      # EnforceCodeStyleInBuild + TreatWarningsAsErrors (Directory.Build.props) hacen que
      # este build ya falle ante violaciones de code style. No hay linter separado en el repo.
      - name: Compilar
        run: dotnet build --no-restore --configuration Release

      # Sin filtro extra: tests.runsettings (via Directory.Build.props) excluye por defecto
      # los tests Categoria=Integracion, que son los que pegan contra Ollama real.
      - name: Correr tests
        run: dotnet test --no-build --configuration Release
